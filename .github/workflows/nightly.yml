# ══════════════════════════════════════════════════════════════════════════════
# nightly.yml — Relevé de nuit (catalogue, classement, ventes, promotions)
#
# Dépôt public mgp-nightly : minutes GitHub Actions illimitées (le dépôt privé n'en a que 2 000 par mois, le
# relevé en prenait ~1 500). Copie automatique depuis le dépôt privé (workflow sync_jobs.yml) : ne pas modifier
# ici. Lancé chaque nuit à 4 h 23 UTC par le Worker Cloudflare. Journaux réduits (dépôt public) : sortie des
# scripts affichée seulement en cas d'échec.
# ══════════════════════════════════════════════════════════════════════════════

name: "Nightly"

on:
  workflow_dispatch:
    inputs:
      check:
        description: "Vérification seulement (imports et secrets), sans relevé"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # Compteurs des pages recalculés une seule fois, à la fin (étape « Refresh page counters ») : chaque calcul relit
  # toute la table ; 4 à 6 par nuit épuisaient le budget d'accès disque de la base gratuite (22/11).
  SKIP_STATS_REFRESH: "1"

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install boto3 (R2)
        run: pip install --quiet boto3

      - name: Check only
        if: inputs.check
        run: |
          python3 -c "import catalog_sync, track_prices; import sys; sys.path.insert(0, 'scripts'); import awin_sync, awin_promotions, awin_commissions, classify_categories, classify_rayons, ship_zones, forecast, demand"
          for k in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY AWIN_PRODUCTDATA_KEY AWIN_API_TOKEN AWIN_PUBLISHER_ID R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME GOOGLE_AI_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            [ -n "${!k}" ] || { echo "secret manquant : $k"; exit 1; }
          done
          echo "ok"
        env:
          AWIN_PRODUCTDATA_KEY: ${{ secrets.AWIN_PRODUCTDATA_KEY }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Pays de livraison des boutiques (Shopify : /meta.json) : marchés en euros livrés, bons plans de l'étranger
      - name: Shipping countries
        id: ships
        if: ${{ !inputs.check }}
        run: python3 scripts/ship_zones.py > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}

      # Demande mesurée (recherches, pages vues, clics, ventes, IA, Google) : choix et classement du catalogue
      - name: Measured demand
        id: demand
        if: ${{ always() && !inputs.check }}
        run: python3 scripts/demand.py > out.log 2>&1 || { tail -n 40 out.log; exit 1; }

      - name: Sync catalogue (all partner feeds)
        id: catalog
        if: ${{ always() && !inputs.check }}
        run: python3 catalog_sync.py > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          AWIN_PRODUCTDATA_KEY: ${{ secrets.AWIN_PRODUCTDATA_KEY }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}               # programmes rejoints et actifs
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}       # marchands entrés ou sortis
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}          # traduction des bons plans de l'étranger
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      # Catégories de boutique nouvelles : rayon décidé une fois par Gemini, puis appliqué aux produits
      - name: Classify new store categories (Gemini Flash)
        id: cats
        if: ${{ always() && !inputs.check }}
        run: python3 scripts/classify_categories.py > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}

      # Produits restés sans rayon : classés par Gemini Flash Lite d'après leur titre (offre gratuite)
      - name: Classify unassigned products (Gemini Flash Lite)
        id: rayons
        if: ${{ always() && !inputs.check }}
        run: python3 scripts/classify_rayons.py --max 25000 > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}

      # Sous-rayon d'après le titre (produits sans catégorie de boutique utilisable), après classify_categories
      - name: Classify sub-departments by title (Gemini Flash Lite)
        id: sous
        if: ${{ always() && !inputs.check }}
        run: python3 scripts/classify_sous_titles.py --max 8000 > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}

      - name: Refresh page counters (once)
        id: counters
        if: ${{ always() && !inputs.check }}
        run: |
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from classify_rayons import sb; sb('POST', 'rpc/refresh_site_stats', {}); sb('POST', 'rpc/refresh_sous_rayon_stats', {})"

      - name: Sync Awin sales and clicks
        id: sales
        if: ${{ always() && !inputs.check }}
        run: python3 scripts/awin_sync.py > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}

      # Taux de commission de chaque boutique (variables) : changements signalés sur Telegram, rayon → taux (Gemini)
      - name: Commission rates
        id: commissions
        if: ${{ always() && !inputs.check }}
        run: python3 scripts/awin_commissions.py > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Prévision des revenus (tableau de bord /stats/prevision), après les ventes de la nuit
      - name: Revenue forecast
        id: forecast
        if: ${{ always() && !inputs.check }}
        run: python3 scripts/forecast.py > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}

      - name: Sync Awin promotions and promo codes
        id: promos
        if: ${{ always() && !inputs.check }}
        run: python3 scripts/awin_promotions.py > out.log 2>&1 || { tail -n 40 out.log; exit 1; }
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}

      - name: Alert on failure (Telegram)
        if: failure()
        # Message selon l'étape en échec (22/11 : un 503 des codes promo annoncé comme « relevé des prix échoué »)
        run: |
          f=""
          [ "$S_SHIPS" = failure ] && f="$f, pays de livraison"
          [ "$S_DEMAND" = failure ] && f="$f, demande mesurée"
          [ "$S_CATS" = failure ] && f="$f, classement des catégories"
          [ "$S_RAYONS" = failure ] && f="$f, classement des produits"
          [ "$S_SOUS" = failure ] && f="$f, sous-rayons"
          [ "$S_COUNTERS" = failure ] && f="$f, compteurs des pages"
          [ "$S_SALES" = failure ] && f="$f, ventes Awin"
          [ "$S_COMMISSIONS" = failure ] && f="$f, taux de commission"
          [ "$S_FORECAST" = failure ] && f="$f, prévision des revenus"
          [ "$S_PROMOS" = failure ] && f="$f, codes promo"
          if [ "$S_CATALOG" = failure ] || [ -z "$f" ]; then
            msg="🚨 MyGoodPick : le relevé des prix de cette nuit a échoué. Détail : ${RUN_URL}"
          else
            msg="⚠️ MyGoodPick : relevé des prix réussi, mais une étape annexe a échoué (${f#, }). Le site est à jour. Détail : ${RUN_URL}"
          fi
          curl -s --max-time 30 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${msg}" > /dev/null
        env:
          S_CATALOG: ${{ steps.catalog.outcome }}
          S_SHIPS: ${{ steps.ships.outcome }}
          S_DEMAND: ${{ steps.demand.outcome }}
          S_CATS: ${{ steps.cats.outcome }}
          S_RAYONS: ${{ steps.rayons.outcome }}
          S_SOUS: ${{ steps.sous.outcome }}
          S_COUNTERS: ${{ steps.counters.outcome }}
          S_SALES: ${{ steps.sales.outcome }}
          S_COMMISSIONS: ${{ steps.commissions.outcome }}
          S_FORECAST: ${{ steps.forecast.outcome }}
          S_PROMOS: ${{ steps.promos.outcome }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
